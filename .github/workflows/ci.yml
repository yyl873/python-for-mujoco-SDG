name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 卫生检查要用 `git ls-files` 判断哪些文件被跟踪，必须拿全历史/索引
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # CI 上**不装** mujoco / torch / lerobot：整套测试只依赖标准库 + 落盘 json。
        # 需要仿真的用例带 @pytest.mark.sim，默认 skip（见 pytest.ini 的 markers）。
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests -q