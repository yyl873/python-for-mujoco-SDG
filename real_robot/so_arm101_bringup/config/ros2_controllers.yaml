controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      
    mujoco_camera_plugin:
      type: "mujoco_ros2_control_plugins/CameraPlugin"
      camera_publish_rate: 10.0


joint_trajectory_controller:
  ros__parameters:
    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_flex_joint
      - wrist_flex_joint
      - wrist_roll_joint
      - gripper_joint
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.1
      shoulder_pan_joint: { trajectory: 10.0, goal: 10.0 }
      shoulder_lift_joint: { trajectory: 10.0, goal: 10.0 }
      elbow_flex_joint: { trajectory: 10.0, goal: 10.0 }
      wrist_flex_joint: { trajectory: 10.0, goal: 10.0 }
      wrist_roll_joint: { trajectory: 10.0, goal: 10.0 }
      gripper_joint: { trajectory: 10.0, goal: 10.0 }