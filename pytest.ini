[pytest]
testpaths = tests
# `-p no:pytest_cov`：本机 /usr/lib/python3.10/xml/dom 的 .pyc 损坏（nobody 属主），
# 系统装的 pytest-cov 3.0.0 在 pytest 启动阶段 import coverage → xml.dom.minidom 直接抛
# ValueError: bad marshal data，整套测试根本跑不起来（rc=1，一条用例都没收集）。
# 本套件不需要覆盖率插件，禁掉即可；CI 上没装 pytest-cov，这条对它是无害的空操作。
addopts = -q -p no:pytest_cov
markers =
    # 本套件目前没有仿真用例（能测的模块都特意选了顶层不 import mujoco 的）。
    # 保留这个 marker 供以后加仿真用例使用：@pytest.mark.sim + pytest.importorskip("mujoco")。
    sim: needs mujoco (本机 import mujoco 会 SIGFPE，CI 上也不装；用 -m sim 显式筛选)