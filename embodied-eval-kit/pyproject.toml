[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-eval-kit"
version = "0.2.0"
description = "Exact small-sample evaluation for embodied policies: counterfactual pairing, clean-success gates, three-state receipts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yyl" }]
keywords = [
  "robotics",
  "evaluation",
  "imitation-learning",
  "language-conditioned",
  "statistics",
  "counterfactual",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []          # deliberate: standard library only

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
eeval = "eeval.cli:main"

[project.urls]
Source = "https://github.com/yyl873/embodied-eval-kit"

[tool.setuptools]
packages = ["eeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]