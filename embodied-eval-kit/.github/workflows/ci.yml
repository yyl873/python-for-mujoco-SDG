name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no runtime dependencies, only the test extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test suite
        run: python -m pytest tests -q

      - name: Zero-dependency numeric self-check (no pytest involved)
        run: python -m eeval selfcheck

      - name: Demo on real data
        run: python examples/demo_real_run.py

      - name: Demo on synthetic data
        run: python examples/demo_synthetic.py

      - name: Byte-compile everything
        run: python -m compileall -q eeval examples tests